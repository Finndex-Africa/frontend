[build]
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  # Must stay >= 22.13: Corepack installs the pnpm pinned in package.json
  # (pnpm 11), which imports node:sqlite — a module that does not exist before
  # Node 22, so pnpm crashes during install rather than at build time.
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"